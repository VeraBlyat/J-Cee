# Servidor DNS de la LAN 192.168.13.0/24 (rúbrica: "El dominio o DNS está
# correctamente configurado y permite acceder al servicio").
#
# El Router3 reparte la IP de esta máquina (192.168.13.10) como servidor DNS
# por DHCP, de modo que CUALQUIER equipo que se conecte al switch resuelve
# unistream.lan sin tener que tocar su archivo hosts.

# --- Registros de la zona unistream.lan ----------------------------------
# host-record crea el registro A y también el PTR (resolución inversa), y
# solo coincide con el nombre EXACTO — a diferencia de address=/dominio/,
# que también atraparía todos los subdominios.
host-record=unistream.lan,192.168.13.20         # Frontend (PC-FRONT)
host-record=api.unistream.lan,192.168.13.10     # Backend  (PC-BACK)

# Somos autoritativos para este dominio: nunca preguntamos afuera por él.
# Un nombre .lan que no esté arriba devuelve NXDOMAIN en vez de filtrarse
# a los DNS públicos.
local=/unistream.lan/

# Dominio por defecto: si alguien pide solo "unistream", se completa.
domain=unistream.lan
expand-hosts

# --- Reenvío de todo lo demás ---------------------------------------------
# No leer el /etc/resolv.conf del contenedor (apunta al DNS interno de
# Docker; usarlo aquí crearía un bucle de resolución).
no-resolv
server=8.8.8.8
server=1.1.1.1

# --- Higiene ---------------------------------------------------------------
# No reenviar a internet nombres sin punto...
domain-needed
# ...ni consultas inversas de rangos privados.
bogus-priv

# Cache de 1000 entradas (por defecto son 150).
cache-size=1000

# Log de consultas: útil en la demostración para MOSTRAR que el DNS responde
# (`docker compose logs -f dns`). Coméntalo si hace mucho ruido.
log-queries
